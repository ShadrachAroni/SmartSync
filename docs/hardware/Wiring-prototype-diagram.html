  <!-- Define styles -->

    <text x="118" y="153" class="text-small">−</text>
    
    <!-- Buck Converter -->

    <circle cx="290" cy="165" r="3" fill="black" />

      <text x="10" y="48" class="text-small">S</text>
      <circle cx="35" cy="28" r="2" fill="#00aa00" />
      <text x="22" y="31" class="text-small">G</text>

    <text x="1222" y="252" class="text-small">100Ω</text>
  </g>

    <rect x="850" y="350" width="80" height="60" class="component" />
    <text x="890" y="375" class="text" text-anchor="middle" style="font-weight: bold;">Buzzer</text>
    <text x="890" y="390" class="text-small" text-anchor="middle">Active 5V</text>
