<svg viewBox="0 0 1400 1000" xmlns="http://www.w3.org/2000/svg">
    <!-- Title -->
    <text x="700" y="30" font-size="24" font-weight="bold" text-anchor="middle" fill="#333">SmartSync Prototype Wiring Diagram</text>
    
    <!-- Power Supply Section -->
    <g id="power-supply">
      <rect x="50" y="60" width="140" height="100" fill="#FFE5B4" stroke="#333" stroke-width="2"/>
      <text x="120" y="85" font-size="14" font-weight="bold" text-anchor="middle">12V Power</text>
      <text x="120" y="105" font-size="14" font-weight="bold" text-anchor="middle">Supply</text>
      <circle cx="80" cy="135" r="5" fill="red"/>
      <text x="95" y="140" font-size="12" fill="red">12V+</text>
      <circle cx="160" cy="135" r="5" fill="black"/>
      <text x="135" y="140" font-size="12">GND</text>
    </g>
    
    <!-- Buck Converter -->
    <g id="buck-converter">
      <rect x="250" y="60" width="140" height="100" fill="#B4D7FF" stroke="#333" stroke-width="2"/>
      <text x="320" y="85" font-size="14" font-weight="bold" text-anchor="middle">Buck Converter</text>
      <text x="320" y="105" font-size="12" text-anchor="middle">12V → 5V</text>
      <text x="270" y="130" font-size="11">IN+</text>
      <text x="270" y="145" font-size="11">IN-</text>
      <text x="345" y="130" font-size="11">OUT+ 5V</text>
      <text x="345" y="145" font-size="11">OUT-</text>
    </g>
    
    <!-- ESP32 DevKitC -->
    <g id="esp32">
      <rect x="550" y="200" width="180" height="380" fill="#90EE90" stroke="#333" stroke-width="3"/>
      <text x="640" y="225" font-size="16" font-weight="bold" text-anchor="middle">ESP32 DevKitC</text>
      
      <!-- Left side pins -->
      <circle cx="560" cy="260" r="4" fill="#333"/>
      <text x="575" y="265" font-size="10">3V3</text>
      
      <circle cx="560" cy="285" r="4" fill="#333"/>
      <text x="575" y="290" font-size="10">GND</text>
      
      <circle cx="560" cy="310" r="4" fill="#333"/>
      <text x="575" y="315" font-size="10">GPIO27 (DHT)</text>
      
      <circle cx="560" cy="335" r="4" fill="#333"/>
      <text x="575" y="340" font-size="10">GPIO25 (PIR)</text>
      
      <circle cx="560" cy="360" r="4" fill="#333"/>
      <text x="575" y="365" font-size="10">GPIO32 (TRIG)</text>
      
      <circle cx="560" cy="385" r="4" fill="#333"/>
      <text x="575" y="390" font-size="10">GPIO33 (ECHO)</text>
      
      <circle cx="560" cy="410" r="4" fill="#333"/>
      <text x="575" y="415" font-size="10">GPIO21 (SDA)</text>
      
      <circle cx="560" cy="435" r="4" fill="#333"/>
      <text x="575" y="440" font-size="10">GPIO22 (SCL)</text>
      
      <!-- Right side pins -->
      <circle cx="720" cy="260" r="4" fill="#333"/>
      <text x="665" y="265" font-size="10" text-anchor="end">VIN (5V)</text>
      
      <circle cx="720" cy="310" r="4" fill="#333"/>
      <text x="665" y="315" font-size="10" text-anchor="end">GPIO26 (FAN)</text>
      
      <circle cx="720" cy="335" r="4" fill="#333"/>
      <text x="665" y="340" font-size="10" text-anchor="end">GPIO14 (LED)</text>
      
      <circle cx="720" cy="360" r="4" fill="#333"/>
      <text x="665" y="365" font-size="10" text-anchor="end">GPIO13 (BUZ)</text>
      
      <circle cx="720" cy="385" r="4" fill="#333"/>
      <text x="665" y="390" font-size="10" text-anchor="end">GPIO2 (STATUS)</text>
      
      <circle cx="720" cy="550" r="4" fill="#333"/>
      <text x="665" y="555" font-size="10" text-anchor="end">USB</text>
    </g>
    
    <!-- DHT22 Sensor -->
    <g id="dht22">
      <rect x="250" y="270" width="100" height="80" fill="#FFD700" stroke="#333" stroke-width="2"/>
      <text x="300" y="290" font-size="12" font-weight="bold" text-anchor="middle">DHT22</text>
      <text x="265" y="310" font-size="10">VCC</text>
      <text x="265" y="325" font-size="10">DATA</text>
      <text x="265" y="340" font-size="10">GND</text>
    </g>
    
    <!-- PIR Sensor -->
    <g id="pir">
      <rect x="250" y="370" width="100" height="80" fill="#FFB6C1" stroke="#333" stroke-width="2"/>
      <text x="300" y="390" font-size="12" font-weight="bold" text-anchor="middle">PIR HC-SR501</text>
      <text x="265" y="410" font-size="10">VCC (5V)</text>
      <text x="265" y="425" font-size="10">OUT</text>
      <text x="265" y="440" font-size="10">GND</text>
    </g>
    
    <!-- HC-SR04 Ultrasonic -->
    <g id="ultrasonic">
      <rect x="250" y="470" width="100" height="95" fill="#87CEEB" stroke="#333" stroke-width="2"/>
      <text x="300" y="490" font-size="12" font-weight="bold" text-anchor="middle">HC-SR04</text>
      <text x="265" y="510" font-size="10">VCC (5V)</text>
      <text x="265" y="525" font-size="10">TRIG</text>
      <text x="265" y="540" font-size="10">ECHO</text>
      <text x="265" y="555" font-size="10">GND</text>
    </g>
    
    <!-- DS3231 RTC -->
    <g id="rtc">
      <rect x="250" y="585" width="100" height="95" fill="#DDA0DD" stroke="#333" stroke-width="2"/>
      <text x="300" y="605" font-size="12" font-weight="bold" text-anchor="middle">DS3231 RTC</text>
      <text x="265" y="625" font-size="10">VCC (5V)</text>
      <text x="265" y="640" font-size="10">SDA</text>
      <text x="265" y="655" font-size="10">SCL</text>
      <text x="265" y="670" font-size="10">GND</text>
    </g>
    
    <!-- Fan with MOSFET -->
    <g id="fan">
      <rect x="900" y="250" width="120" height="100" fill="#E0E0E0" stroke="#333" stroke-width="2"/>
      <text x="960" y="275" font-size="14" font-weight="bold" text-anchor="middle">12V Fan</text>
      <circle cx="930" cy="310" r="5" fill="red"/>
      <text x="945" y="315" font-size="11" fill="red">+</text>
      <circle cx="990" cy="310" r="5" fill="black"/>
      <text x="975" y="315" font-size="11">−</text>
      
      <!-- MOSFET -->
      <path d="M 990 310 L 990 330 L 970 340 L 990 350 L 990 370" stroke="#333" stroke-width="2" fill="none"/>
      <circle cx="970" cy="340" r="3" fill="#333"/>
      <line x1="820" y1="340" x2="965" y2="340" stroke="#FF6600" stroke-width="2"/>
      <text x="880" y="330" font-size="9" fill="#FF6600">GPIO26 + 100Ω</text>
    </g>
    
    <!-- LED Strip with MOSFET -->
    <g id="led-strip">
      <rect x="900" y="400" width="120" height="100" fill="#FFFF99" stroke="#333" stroke-width="2"/>
      <text x="960" y="425" font-size="14" font-weight="bold" text-anchor="middle">LED Strip</text>
      <text x="960" y="443" font-size="11" text-anchor="middle">12V</text>
      <circle cx="930" cy="460" r="5" fill="red"/>
      <text x="945" y="465" font-size="11" fill="red">+</text>
      <circle cx="990" cy="460" r="5" fill="black"/>
      <text x="975" y="465" font-size="11">−</text>
      
      <!-- MOSFET -->
      <path d="M 990 460 L 990 480 L 970 490 L 990 500 L 990 520" stroke="#333" stroke-width="2" fill="none"/>
      <circle cx="970" cy="490" r="3" fill="#333"/>
      <line x1="820" y1="490" x2="965" y2="490" stroke="#0066FF" stroke-width="2"/>
      <text x="880" y="480" font-size="9" fill="#0066FF">GPIO14 + 100Ω</text>
    </g>
    
    <!-- Buzzer -->
    <g id="buzzer">
      <rect x="1100" y="400" width="100" height="80" fill="#FFA07A" stroke="#333" stroke-width="2"/>
      <text x="1150" y="420" font-size="12" font-weight="bold" text-anchor="middle">Buzzer</text>
      <text x="1115" y="440" font-size="10">VCC (5V)</text>
      <text x="1115" y="455" font-size="10">IN</text>
      <text x="1115" y="470" font-size="10">GND</text>
    </g>
    
    <!-- Status LED -->
    <g id="status-led">
      <rect x="1100" y="250" width="100" height="80" fill="#98FB98" stroke="#333" stroke-width="2"/>
      <text x="1150" y="270" font-size="12" font-weight="bold" text-anchor="middle">Status LED</text>
      <circle cx="1150" cy="295" r="8" fill="yellow" stroke="#333"/>
      <text x="1120" y="320" font-size="9">330Ω to GPIO2</text>
    </g>
    
    <!-- Power lines from supply -->
    <line x1="80" y1="135" x2="80" y2="180" stroke="red" stroke-width="3"/>
    <line x1="80" y1="180" x2="270" y2="180" stroke="red" stroke-width="3"/>
    <line x1="270" y1="180" x2="270" y2="125" stroke="red" stroke-width="3"/>
    <text x="150" y="175" font-size="9" fill="red">12V+</text>
    
    <!-- 12V to fan and LED -->
    <line x1="80" y1="180" x2="930" y2="180" stroke="red" stroke-width="3"/>
    <line x1="930" y1="180" x2="930" y2="310" stroke="red" stroke-width="3"/>
    <line x1="930" y1="180" x2="930" y2="460" stroke="red" stroke-width="3"/>
    
    <!-- Ground lines -->
    <line x1="160" y1="135" x2="160" y2="700" stroke="black" stroke-width="3"/>
    <line x1="160" y1="700" x2="1200" y2="700" stroke="black" stroke-width="3"/>
    <text x="600" y="715" font-size="11" font-weight="bold">Common Ground</text>
    
    <!-- Buck connections -->
    <line x1="390" y1="125" x2="450" y2="125" stroke="orange" stroke-width="2"/>
    <line x1="450" y1="125" x2="450" y2="250" stroke="orange" stroke-width="2"/>
    <line x1="450" y1="250" x2="720" y2="250" stroke="orange" stroke-width="2"/>
    <line x1="720" y1="250" x2="720" y2="260" stroke="orange" stroke-width="2"/>
    <text x="500" y="245" font-size="9" fill="orange">5V Rail</text>
    
    <!-- 5V to sensors -->
    <line x1="450" y1="250" x2="300" y2="250" stroke="orange" stroke-width="2"/>
    <line x1="300" y1="250" x2="300" y2="395" stroke="orange" stroke-width="1.5"/>
    <line x1="300" y1="395" x2="300" y2="495" stroke="orange" stroke-width="1.5"/>
    <line x1="300" y1="495" x2="300" y2="610" stroke="orange" stroke-width="1.5"/>
    <line x1="300" y1="395" x2="265" y2="395" stroke="orange" stroke-width="1.5"/>
    <line x1="300" y1="495" x2="265" y2="495" stroke="orange" stroke-width="1.5"/>
    <line x1="300" y1="610" x2="265" y2="610" stroke="orange" stroke-width="1.5"/>
    
    <!-- 5V to buzzer -->
    <line x1="450" y1="250" x2="1150" y2="250" stroke="orange" stroke-width="2"/>
    <line x1="1150" y1="250" x2="1150" y2="425" stroke="orange" stroke-width="1.5"/>
    <line x1="1150" y1="425" x2="1115" y2="425" stroke="orange" stroke-width="1.5"/>
    
    <!-- 3.3V from ESP32 -->
    <line x1="560" y1="260" x2="500" y2="260" stroke="purple" stroke-width="2"/>
    <line x1="500" y1="260" x2="500" y2="220" stroke="purple" stroke-width="2"/>
    <line x1="500" y1="220" x2="280" y2="220" stroke="purple" stroke-width="2"/>
    <line x1="280" y1="220" x2="280" y2="295" stroke="purple" stroke-width="1.5"/>
    <line x1="280" y1="295" x2="265" y2="295" stroke="purple" stroke-width="1.5"/>
    <text x="380" y="215" font-size="9" fill="purple">3.3V to DHT22</text>
    
    <!-- DHT22 data connection -->
    <line x1="350" y1="310" x2="480" y2="310" stroke="green" stroke-width="1.5"/>
    <line x1="480" y1="310" x2="560" y2="310" stroke="green" stroke-width="1.5"/>
    
    <!-- PIR connection -->
    <line x1="350" y1="410" x2="480" y2="410" stroke="green" stroke-width="1.5"/>
    <line x1="480" y1="410" x2="480" y2="335" stroke="green" stroke-width="1.5"/>
    <line x1="480" y1="335" x2="560" y2="335" stroke="green" stroke-width="1.5"/>
    
    <!-- Ultrasonic connections -->
    <line x1="350" y1="510" x2="470" y2="510" stroke="green" stroke-width="1.5"/>
    <line x1="470" y1="510" x2="470" y2="360" stroke="green" stroke-width="1.5"/>
    <line x1="470" y1="360" x2="560" y2="360" stroke="green" stroke-width="1.5"/>
    
    <line x1="350" y1="525" x2="460" y2="525" stroke="blue" stroke-width="1.5"/>
    <line x1="460" y1="525" x2="460" y2="385" stroke="blue" stroke-width="1.5"/>
    <line x1="460" y1="385" x2="560" y2="385" stroke="blue" stroke-width="1.5"/>
    
    <!-- I2C connections -->
    <line x1="350" y1="625" x2="440" y2="625" stroke="brown" stroke-width="1.5"/>
    <line x1="440" y1="625" x2="440" y2="410" stroke="brown" stroke-width="1.5"/>
    <line x1="440" y1="410" x2="560" y2="410" stroke="brown" stroke-width="1.5"/>
    
    <line x1="350" y1="640" x2="430" y2="640" stroke="gray" stroke-width="1.5"/>
    <line x1="430" y1="640" x2="430" y2="435" stroke="gray" stroke-width="1.5"/>
    <line x1="430" y1="435" x2="560" y2="435" stroke="gray" stroke-width="1.5"/>
    
    <!-- Fan MOSFET gate -->
    <line x1="720" y1="310" x2="820" y2="310" stroke="#FF6600" stroke-width="2"/>
    <line x1="820" y1="310" x2="820" y2="340" stroke="#FF6600" stroke-width="2"/>
    
    <!-- LED MOSFET gate -->
    <line x1="720" y1="335" x2="820" y2="335" stroke="#0066FF" stroke-width="2"/>
    <line x1="820" y1="335" x2="820" y2="490" stroke="#0066FF" stroke-width="2"/>
    
    <!-- Buzzer control -->
    <line x1="720" y1="360" x2="1050" y2="360" stroke="magenta" stroke-width="1.5"/>
    <line x1="1050" y1="360" x2="1050" y2="440" stroke="magenta" stroke-width="1.5"/>
    <line x1="1050" y1="440" x2="1115" y2="440" stroke="magenta" stroke-width="1.5"/>
    
    <!-- Status LED -->
    <line x1="720" y1="385" x2="1050" y2="385" stroke="lime" stroke-width="1.5"/>
    <line x1="1050" y1="385" x2="1050" y2="295" stroke="lime" stroke-width="1.5"/>
    <line x1="1050" y1="295" x2="1115" y2="295" stroke="lime" stroke-width="1.5"/>
    
    <!-- Ground connections to sensors -->
    <line x1="265" y1="325" x2="160" y2="325" stroke="black" stroke-width="1.5"/>
    <line x1="265" y1="425" x2="160" y2="425" stroke="black" stroke-width="1.5"/>
    <line x1="265" y1="540" x2="160" y2="540" stroke="black" stroke-width="1.5"/>
    <line x1="265" y1="655" x2="160" y2="655" stroke="black" stroke-width="1.5"/>
    
    <!-- Ground to MOSFETs -->
    <line x1="990" y1="370" x2="990" y2="700" stroke="black" stroke-width="2"/>
    <line x1="990" y1="520" x2="990" y2="700" stroke="black" stroke-width="2"/>
    
    <!-- Ground to buzzer and status LED -->
    <line x1="1115" y1="455" x2="1200" y2="455" stroke="black" stroke-width="1.5"/>
    <line x1="1150" y1="310" x2="1200" y2="310" stroke="black" stroke-width="1.5"/>
    
    <!-- Legend -->
    <g id="legend" transform="translate(50, 750)">
      <rect x="0" y="0" width="280" height="200" fill="#F5F5F5" stroke="#333" stroke-width="1" rx="5"/>
      <text x="10" y="20" font-size="12" font-weight="bold">Legend & Notes:</text>
      
      <line x1="10" y1="35" x2="40" y2="35" stroke="red" stroke-width="3"/>
      <text x="50" y="40" font-size="10">12V Power</text>
      
      <line x1="10" y1="50" x2="40" y2="50" stroke="orange" stroke-width="2"/>
      <text x="50" y="55" font-size="10">5V Regulated</text>
      
      <line x1="10" y1="65" x2="40" y2="65" stroke="purple" stroke-width="2"/>
      <text x="50" y="70" font-size="10">3.3V Logic</text>
      
      <line x1="10" y1="80" x2="40" y2="80" stroke="black" stroke-width="3"/>
      <text x="50" y="85" font-size="10">Ground (Common)</text>
      
      <line x1="10" y1="95" x2="40" y2="95" stroke="green" stroke-width="1.5"/>
      <text x="50" y="100" font-size="10">Signal Lines</text>
      
      <text x="10" y="125" font-size="9" font-weight="bold">Important:</text>
      <text x="10" y="140" font-size="8">• Add 10kΩ pullup on DHT22 DATA</text>
      <text x="10" y="153" font-size="8">• Add 4.7kΩ pullups on I²C (SDA/SCL)</text>
      <text x="10" y="166" font-size="8">• Use voltage divider on HC-SR04 ECHO</text>
      <text x="10" y="179" font-size="8">• Add flyback diodes on fan/LED MOSFETs</text>
      <text x="10" y="192" font-size="8">• 100kΩ pulldown resistors on MOSFET gates</text>
    </g>
    
    <!-- USB connection indicator -->
    <rect x="720" y="530" width="120" height="50" fill="#E8E8E8" stroke="#333" stroke-width="1" rx="5"/>
    <text x="780" y="555" font-size="11" font-weight="bold" text-anchor="middle">USB to PC</text>
    <text x="780" y="570" font-size="9" text-anchor="middle">(Programming/Debug)</text>
  </svg>
